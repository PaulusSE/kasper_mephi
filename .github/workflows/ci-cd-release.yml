name: Deploy to Production Server
on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up SSH key and SSH command
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.RELEASE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p ${{ secrets.RELEASE_SERVER_PORT }} ${{ secrets.RELEASE_SERVER_HOST }} >> ~/.ssh/known_hosts
        ls -la ~/.ssh/
        cat ~/.ssh/id_rsa

    - name: Copy entire repository to Server
      run: |
        rsync -avz --progress -e "ssh -p ${{ secrets.RELEASE_SERVER_PORT }} -o StrictHostKeyChecking=no" --exclude '.git' ./ ${{ secrets.RELEASE_SERVER_USER }}@${{ secrets.RELEASE_SERVER_HOST }}:/root/kasper-server
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.RELEASE_SERVER_PORT }} ${{ secrets.RELEASE_SERVER_USER }}@${{ secrets.RELEASE_SERVER_HOST }} "ls -R /root/kasper-server"

    - name: Docker Compose Down
      run: |
        ssh -t -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=480 -p ${{ secrets.RELEASE_SERVER_PORT }} ${{ secrets.RELEASE_SERVER_USER }}@${{ secrets.RELEASE_SERVER_HOST }} "echo ${{ secrets.RELEASE_SERVER_PASSWORD }} | sudo -S docker-compose -f /root/kasper-server/docker-compose-prod.yaml down"

    - name: Docker Compose Up and Rebuild
      run: |
        ssh -t -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=480 -p ${{ secrets.RELEASE_SERVER_PORT }} ${{ secrets.RELEASE_SERVER_USER }}@${{ secrets.RELEASE_SERVER_HOST }} "echo ${{ secrets.RELEASE_SERVER_PASSWORD }} | sudo -S docker-compose -f /root/kasper-server/docker-compose-prod.yaml up --build -d"
